; AWS IoT Core connection for --transport aws.
; Copy to config.ini and fill in your account's values. NEVER commit config.ini
; or the credential files — they are gitignored (*.pem / *.key / *.crt).
;
; Every field can also be supplied via environment variable (see config.py),
; e.g. LOADGEN_ENDPOINT, LOADGEN_CERT, LOADGEN_KEY, LOADGEN_CA.

[aws]
; Your account's ATS data endpoint: AWS IoT Core > Settings > Device data endpoint.
; The Learner Lab backend is deployed in us-east-1 (see backend/DEPLOY.md).
endpoint = xxxxxxxxxxxxxx-ats.iot.us-east-1.amazonaws.com
port = 8883
region = us-east-1

; Distinct MQTT client id — IoT Core force-disconnects duplicate client ids,
; so keep this different from the firmware boards (esp32-a / esp32-b).
clientId = virtual-loadgen

; Paths to the device credentials downloaded when you created the IoT thing.
certFile = certs/device-certificate.pem.crt
keyFile  = certs/device-private.pem.key
caFile   = certs/AmazonRootCA1.pem

; Optional — override the profile / contract defaults if needed:
; garageId = garage1
; sensorId = virtual-loadgen
