# Drive & Decide — cost-model assumptions (SINGLE SOURCE OF TRUTH)
#
# Values filled 2026-06 from the source cited per line: AWS official pricing,
# a real Vienna operator tariff, Austrian statistics / trade rates, vendor
# price lists, and peer-reviewed smart-parking literature (in references.bib).
# AWS USD prices converted at 1 EUR = 1.08 USD (ECB reference range, 2026-06).
#   ASSUMPTION = engineering/scenario estimate, not a measurement.
#   MEASURE    = replace with a CloudWatch / Cost Explorer figure when available.

[meta]
horizon_years = 5
currency = "EUR"
discount_rate = 0.0        # 0 = undiscounted (paper default). Set e.g. 0.07 for an NPV cross-check.

# --- CAPEX (one-time) -------------------------------------------------------
[capex]
sensor_eur            = 0.80    # TCRT5000 IR module — vendor (createc3d EUR 0.58, Reichelt DEBO-IR), low volume
wiring_eur_per_spot   = 3.00    # cable + connectors per spot — ASSUMPTION (install design)
install_eur_per_spot  = 16.00   # 0.2 h/spot x ~80 EUR/h — Arbeiterkammer OOE 2025 (Elektromonteure 64.8-115.3 EUR/h)
sensors_per_controller = 16     # sensors per ESP32 node (GPIO + expander) — ASSUMPTION (node design)
controller_eur        = 12.00   # ESP32-DevKitC (~9 EUR, BerryBase/DigiKey) + enclosure (~3 EUR)
network_fixed_eur     = 1500.0  # gateway/switch/backbone, one-time — ASSUMPTION (network design)
cloud_setup_eur       = 2000.0  # one-time engineering (IaC, certs), ~25 h x ~80 EUR — ASSUMPTION

# --- AWS unit prices + technical constants ----------------------------------
# AWS pricing pages (eu-central-1 intent for a Vienna operator), accessed 2026-06,
# USD->EUR at 1 EUR = 1.08 USD. OPEX is a minor lever (see sensitivity tornado),
# so the standard-tier list prices are sufficient; re-verify in the AWS calculator.
[aws]
iot_messaging_eur_per_million        = 0.93        # IoT Core messaging ($1.00/M)
iot_connection_eur_per_million_min   = 0.074       # IoT Core connectivity ($0.08/M-min)
lambda_eur_per_million_req           = 0.185       # Lambda requests ($0.20/M)
lambda_eur_per_gb_second             = 0.00001543  # Lambda compute ($0.0000166667/GB-s)
lambda_mem_gb                        = 0.128       # function memory (128 MB) — matches template.yaml
lambda_ms_per_invoke                 = 30.0        # mean duration per invoke (ms) — MEASURE (CloudWatch)
ddb_write_eur_per_million            = 1.16        # DynamoDB on-demand WRU ($1.25/M)
ddb_read_eur_per_million             = 0.23        # DynamoDB on-demand RRU ($0.25/M)
ddb_storage_eur_per_gb_month         = 0.23        # DynamoDB storage ($0.25/GB-mo)
apigw_eur_per_million_req            = 0.93        # API Gateway HTTP API ($1.00/M)
data_transfer_eur_per_gb             = 0.083       # data transfer out ($0.09/GB)
item_bytes                           = 150         # size of one ParkingStatus item (contract payload)

# --- Non-cloud recurring OPEX ----------------------------------------------
[non_cloud]
maintenance_pct_of_capex     = 0.05   # annual maintenance as % of CAPEX — ASSUMPTION (IT/infra norm)
sensor_replacement_pct       = 0.10   # ~10 yr sensor life => ~10 %/yr — ASSUMPTION (datasheet/environment)
power_eur_per_controller_year = 2.16  # ESP32 ~1 W x 8760 h x 0.247 EUR/kWh (E-Control/GPP 2025, commercial)

# --- Usage drivers ----------------------------------------------------------
[load]
events_per_spot_per_day = 26.58  # from load_generator peak-profile manifest (400 spots); --manifest overrides.
                                 # Peak = upper estimate for OPEX; a daily peak/off-peak mix would be lower.
dashboard_consumers     = 1.0    # API consumers polling continuously — ASSUMPTION (read-side driver)
poll_interval_s         = 2.5    # poll cadence (matches the web app default)
hours_open_per_day      = 16.0   # garage operating hours — ASSUMPTION

# --- Benefit side -----------------------------------------------------------
[benefits]
parking_tariff_eur_per_space_hour = 4.50  # Vienna inner-city garage — WIPARK 2026 (4.70-4.90 inner, 3.20 outer)
baseline_utilization              = 0.75  # typical urban garage occupancy — literature (wang) / operator
uplift_pp_pessimistic             = 1.0   # +utilisation in percentage points — scenario (literature range)
uplift_pp_base                    = 3.0   # base scenario — informed by wang/sarker/alaanzy (sensitivity range)
uplift_pp_optimistic              = 6.0   # optimistic scenario — literature range
dynamic_pricing_uplift_pct        = 2.0   # extra revenue on baseline (%) — conservative (hassine)

# --- Scale sweep ------------------------------------------------------------
[scale]
spot_counts = [200, 400, 500]    # garage sizes from the use case (methodology.tex §Use Case)
