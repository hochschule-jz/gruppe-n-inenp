AWSTemplateFormatVersion: '2010-09-09'
Description: Drive & Decide MVP backend (AWS Academy Learner Lab, us-east-1 recommended)

Parameters:
  TotalSpots:
    Type: Number
    Default: 4
    MinValue: 1
    Description: >-
      Fallback spot count for any garageId NOT listed in GarageSpots. Drives BOTH
      the validation range check (a valid spotId is 1..count) and the aggregation
      denominator (utilisation = occupied / count). Default 4 preserves the
      originally deployed behaviour for the physical demo board.
  GarageSpots:
    Type: String
    Default: '{}'
    Description: >-
      Per-garage spot counts as a JSON object, e.g.
      {"garage1":4,"garage2":250}. A garageId found here overrides TotalSpots,
      so the 4-bay physical demo (garage1) and the 250-spot virtual load
      generator (garage2) can run concurrently. Any garageId not listed falls
      back to TotalSpots.

Resources:
  ParkingStatusTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ParkingStatus
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: garageId
          AttributeType: S
        - AttributeName: spotId
          AttributeType: N
      KeySchema:
        - AttributeName: garageId
          KeyType: HASH
        - AttributeName: spotId
          KeyType: RANGE
      TableClass: STANDARD
      Tags:
        - Key: Project
          Value: DriveAndDecide
        - Key: Environment
          Value: Lab

  ValidationFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParkingStatusTable
    Properties:
      FunctionName: drive-decide-validation
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      MemorySize: 128
      Timeout: 3
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: ParkingStatus
          DEFAULT_SPOTS: !Sub '${TotalSpots}'
          GARAGE_SPOTS: !Ref GarageSpots
      Code:
        ZipFile: |
          import json
          import os
          import time
          import boto3

          TABLE_NAME = os.environ.get("TABLE_NAME", "ParkingStatus")
          DEFAULT_SPOTS = int(os.environ.get("DEFAULT_SPOTS", "4"))
          GARAGE_SPOTS = json.loads(os.environ.get("GARAGE_SPOTS", "{}"))
          ALLOWED_STATUS = {"occupied", "free"}

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(TABLE_NAME)

          def spots_for(garage_id):
              return int(GARAGE_SPOTS.get(garage_id, DEFAULT_SPOTS))

          def _response(status_code, body):
              return {
                  "statusCode": status_code,
                  "body": json.dumps(body)
              }

          def lambda_handler(event, context):
              print("Received event:", json.dumps(event))

              try:
                  garage_id = str(event["garageId"])
                  sensor_id = str(event["sensorId"])
                  spot_id = int(event["spotId"])
                  raw = int(event["raw"])
                  status = str(event["status"])
                  ts = int(event.get("ts", int(time.time() * 1000)))

                  if not garage_id:
                      raise ValueError("garageId must not be empty")
                  if not sensor_id:
                      raise ValueError("sensorId must not be empty")
                  max_spots = spots_for(garage_id)
                  if spot_id < 1 or spot_id > max_spots:
                      raise ValueError(f"spotId must be between 1 and {max_spots}")
                  if raw not in (0, 1):
                      raise ValueError("raw must be 0 or 1")
                  if status not in ALLOWED_STATUS:
                      raise ValueError("status must be 'occupied' or 'free'")

                  table.update_item(
                      Key={
                          "garageId": garage_id,
                          "spotId": spot_id
                      },
                      UpdateExpression=(
                          "SET #status = :status, "
                          "#raw = :raw, "
                          "ts = :ts, "
                          "sensorId = :sensorId"
                      ),
                      ExpressionAttributeNames={
                          "#status": "status",
                          "#raw": "raw"
                      },
                      ExpressionAttributeValues={
                          ":status": status,
                          ":raw": raw,
                          ":ts": ts,
                          ":sensorId": sensor_id
                      }
                  )

                  return _response(200, {
                      "message": "status stored",
                      "garageId": garage_id,
                      "spotId": spot_id,
                      "status": status
                  })

              except Exception as exc:
                  print("Validation failed:", str(exc))
                  return _response(400, {
                      "message": "validation failed",
                      "error": str(exc)
                  })
      Tags:
        - Key: Project
          Value: DriveAndDecide
        - Key: Environment
          Value: Lab

  AggregationFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParkingStatusTable
    Properties:
      FunctionName: drive-decide-aggregation
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      MemorySize: 128
      Timeout: 3
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: ParkingStatus
          DEFAULT_SPOTS: !Sub '${TotalSpots}'
          GARAGE_SPOTS: !Ref GarageSpots
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from decimal import Decimal

          TABLE_NAME = os.environ.get("TABLE_NAME", "ParkingStatus")
          DEFAULT_SPOTS = int(os.environ.get("DEFAULT_SPOTS", "4"))
          GARAGE_SPOTS = json.loads(os.environ.get("GARAGE_SPOTS", "{}"))

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(TABLE_NAME)

          def decimal_default(obj):
              if isinstance(obj, Decimal):
                  if obj % 1 == 0:
                      return int(obj)
                  return float(obj)
              raise TypeError

          def lambda_handler(event, context):
              print("Received event:", json.dumps(event))

              garage_id = "garage1"
              path_params = event.get("pathParameters") or {}
              if path_params.get("garageId"):
                  garage_id = path_params["garageId"]

              response = table.query(
                  KeyConditionExpression="garageId = :garageId",
                  ExpressionAttributeValues={
                      ":garageId": garage_id
                  }
              )

              items = response.get("Items", [])
              spots = []
              occupied_count = 0

              for item in sorted(items, key=lambda x: int(x["spotId"])):
                  status = item.get("status", "unknown")
                  if status == "occupied":
                      occupied_count += 1
                  spots.append({
                      "spotId": int(item["spotId"]),
                      "status": status,
                      "raw": int(item.get("raw", 0)),
                      "ts": int(item.get("ts", 0)),
                      "sensorId": item.get("sensorId", "unknown")
                  })

              total_spots = int(GARAGE_SPOTS.get(garage_id, DEFAULT_SPOTS))
              free_count = max(total_spots - occupied_count, 0)
              utilization = occupied_count / total_spots if total_spots > 0 else 0

              if utilization < 0.70:
                  light = "green"
              elif utilization <= 0.90:
                  light = "yellow"
              else:
                  light = "red"

              body = {
                  "garageId": garage_id,
                  "totalSpots": total_spots,
                  "occupied": occupied_count,
                  "free": free_count,
                  "utilization": round(utilization, 4),
                  "light": light,
                  "spots": spots
              }

              return {
                  "statusCode": 200,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                  },
                  "body": json.dumps(body, default=decimal_default)
              }
      Tags:
        - Key: Project
          Value: DriveAndDecide
        - Key: Environment
          Value: Lab

  # On-demand load burst, triggered from the web UI's "Andrang simulieren"
  # button. Publishes a fresh randomised snapshot for one garage into IoT Core,
  # so the data flows through the SAME pipeline as the physical board and the
  # virtual load generator (TopicRule -> Validation -> DynamoDB). No new path.
  LoadgenFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: drive-decide-loadgen
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      MemorySize: 256
      Timeout: 29
      Architectures:
        - x86_64
      Environment:
        Variables:
          DEFAULT_SPOTS: !Sub '${TotalSpots}'
          GARAGE_SPOTS: !Ref GarageSpots
      Code:
        ZipFile: |
          import json
          import os
          import random
          import time
          from concurrent.futures import ThreadPoolExecutor

          import boto3

          DEFAULT_SPOTS = int(os.environ.get("DEFAULT_SPOTS", "4"))
          GARAGE_SPOTS = json.loads(os.environ.get("GARAGE_SPOTS", "{}"))

          # Resolve the account's IoT data endpoint once per cold start.
          _endpoint = boto3.client("iot").describe_endpoint(
              endpointType="iot:Data-ATS"
          )["endpointAddress"]
          iot_data = boto3.client("iot-data", endpoint_url=f"https://{_endpoint}")

          def spots_for(garage_id):
              return int(GARAGE_SPOTS.get(garage_id, DEFAULT_SPOTS))

          def _response(status_code, body):
              return {
                  "statusCode": status_code,
                  "headers": {
                      "Content-Type": "application/json",
                      "Access-Control-Allow-Origin": "*"
                  },
                  "body": json.dumps(body)
              }

          def lambda_handler(event, context):
              qs = event.get("queryStringParameters") or {}
              garage_id = str(qs.get("garageId") or "garage2")
              n = spots_for(garage_id)

              # Target utilisation: explicit ?util=0.x, else a random level so
              # one-off bursts move the light across green/yellow/red.
              try:
                  target = float(qs["util"]) if "util" in qs else random.uniform(0.3, 0.95)
              except (TypeError, ValueError):
                  target = random.uniform(0.3, 0.95)
              target = max(0.0, min(1.0, target))

              # mode=snapshot (default): rewrite every spot to a fresh occupancy
              #   near `target` (one click = one full picture).
              # mode=step: re-roll only a few random spots at P(occupied)=target,
              #   so a browser loop can drift utilisation smoothly over time.
              mode = str(qs.get("mode") or "snapshot")
              now = int(time.time() * 1000)

              if mode == "step":
                  try:
                      churn = int(qs["churn"])
                  except (KeyError, TypeError, ValueError):
                      churn = max(1, round(n * 0.05))
                  churn = max(1, min(churn, n))
                  picked = random.sample(range(1, n + 1), churn)
                  changes = {s: (random.random() < target) for s in picked}
              else:
                  occupied_n = int(round(n * target))
                  occupied = set(random.sample(range(1, n + 1), occupied_n))
                  changes = {s: (s in occupied) for s in range(1, n + 1)}

              def publish(item):
                  spot_id, occ = item
                  payload = {
                      "sensorId": "web-loadgen",
                      "garageId": garage_id,
                      "spotId": spot_id,
                      "ts": now,
                      "raw": 1 if occ else 0,
                      "status": "occupied" if occ else "free"
                  }
                  iot_data.publish(
                      topic=f"parking/{garage_id}/spot/{spot_id}",
                      qos=1,
                      payload=json.dumps(payload, separators=(",", ":"))
                  )

              with ThreadPoolExecutor(max_workers=20) as pool:
                  list(pool.map(publish, changes.items()))

              return _response(200, {
                  "message": "load generated",
                  "garageId": garage_id,
                  "mode": mode,
                  "spots": n,
                  "published": len(changes),
                  "occupiedPublished": sum(1 for v in changes.values() if v),
                  "targetUtil": round(target, 3)
              })
      Tags:
        - Key: Project
          Value: DriveAndDecide
        - Key: Environment
          Value: Lab

  IoTPublishPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: drive-decide-iot-publish-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:ClientId}
          - Effect: Allow
            Action: iot:Publish
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/parking/*/spot/*
      Tags:
        - Key: Project
          Value: DriveAndDecide
        - Key: Environment
          Value: Lab

  ParkingStatusTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: drive_decide_parking_status_rule
      TopicRulePayload:
        RuleDisabled: false
        AwsIotSqlVersion: '2016-03-23'
        Sql: SELECT *, topic(4) AS spotIdFromTopic FROM 'parking/+/spot/+'
        Actions:
          - Lambda:
              FunctionArn: !GetAtt ValidationFunction.Arn
      Tags:
        - Key: Project
          Value: DriveAndDecide
        - Key: Environment
          Value: Lab

  ValidationInvokePermissionForIoT:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ValidationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/drive_decide_parking_status_rule

  DriveDecideApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: drive-decide-api
      ProtocolType: HTTP
      RouteSelectionExpression: $request.method $request.path
      DisableExecuteApiEndpoint: false
      Tags:
        Project: DriveAndDecide
        Environment: Lab

  AggregationIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DriveDecideApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AggregationFunction.Arn}/invocations

  AggregationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DriveDecideApi
      RouteKey: GET /garages/{garageId}/utilization
      Target: !Sub integrations/${AggregationIntegration}

  LoadgenIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DriveDecideApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoadgenFunction.Arn}/invocations

  LoadgenRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DriveDecideApi
      RouteKey: POST /loadgen/run
      Target: !Sub integrations/${LoadgenIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DriveDecideApi
      StageName: $default
      AutoDeploy: true
      Tags:
        Project: DriveAndDecide
        Environment: Lab

  AggregationInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AggregationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DriveDecideApi}/*/GET/garages/*/utilization

  LoadgenInvokePermissionForApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LoadgenFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DriveDecideApi}/*/POST/loadgen/run

  # --- Static web hosting (web/dist) ---------------------------------------
  # S3 website endpoint serving the built Vite app. Public read-only; the app
  # is a static bundle and the API it calls is already public + CORS-open.
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      # No explicit BucketName: lets CloudFormation generate a globally unique
      # name. Read it from the StackName-prefixed output after deploy.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      WebsiteConfiguration:
        IndexDocument: index.html
        # SPA-style fallback: any unknown path serves the app shell.
        ErrorDocument: index.html
      Tags:
        - Key: Project
          Value: DriveAndDecide
        - Key: Environment
          Value: Lab

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*

Outputs:
  ApiUrl:
    Description: Public utilization endpoint for garage1
    Value: !Sub https://${DriveDecideApi}.execute-api.${AWS::Region}.amazonaws.com/garages/garage1/utilization
  ApiBase:
    Description: API base URL (no path) for the web app's VITE_API_BASE
    Value: !Sub https://${DriveDecideApi}.execute-api.${AWS::Region}.amazonaws.com
  LoadgenUrl:
    Description: POST endpoint that generates a load burst (web UI button)
    Value: !Sub https://${DriveDecideApi}.execute-api.${AWS::Region}.amazonaws.com/loadgen/run
  IoTTopicPattern:
    Description: MQTT topic pattern for parking spot status messages
    Value: parking/garage1/spot/<spotId>
  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref ParkingStatusTable
  WebsiteBucketName:
    Description: S3 bucket to upload web/dist into (aws s3 sync)
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Description: Public URL of the static web app
    Value: !GetAtt WebsiteBucket.WebsiteURL
