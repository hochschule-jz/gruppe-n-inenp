; PlatformIO project configuration for the Drive & Decide ESP32 firmware.
; Docs: https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev          ; generic ESP32 DevKit; change if your board differs
framework = arduino
monitor_speed = 115200    ; matches the serial baud used in the plan

